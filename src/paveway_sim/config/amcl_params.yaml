use_sim_time: true
autostart: true
set_initial_pose: true

amcl:
  ros__parameters:
    use_sim_time: true
    tf_broadcast: true

    # Sensor model parameters
    min_particles: 500
    max_particles: 2000
    kld_err: 0.05
    kld_z: 0.99
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    laser_min_range: 0.12
    laser_max_range: 3.5

    laser_model_type: likelihood_field
    update_min_d: 0.25
    update_min_a: 0.2
    resample_interval: 1
    transform_tolerance: 1.0
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0

    # Frame settings
    odom_frame_id: "odom"
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    scan_topic: "scan"
